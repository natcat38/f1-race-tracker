# The local stack: Redis, a replay writer per compare lane, and the gateway serving the
# embedded SPA.

services:
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # No host port: services reach Redis over the compose network (redis://redis:6379).
    # Nothing outside the compose network needs it, so it isn't exposed to the host/LAN.

  replay:                      # REPLAY lane → session "replay" (Monza, the default clip)
    build: .
    environment:
      ROLE: replay
      REDIS_URL: redis://redis:6379
      SESSION_KEY: replay
    depends_on: [redis]

  live:                        # LIVE lane → session "live", now published by Python
    build:
      context: .
      dockerfile: ingest/Dockerfile.live
    environment:
      REDIS_URL: redis://redis:6379
      SESSION_KEY: live
      XDG_DATA_HOME: /secrets    # F1TV token resolves to /secrets/fastf1/f1auth.json (ADR-0007)
    command: ["--replay-clip", "/data/replays/silverstone-2024-race.jsonl", "--session", "live"]
    volumes:
      - ./data:/data:ro
      - ./secrets:/secrets:ro    # host-linked F1TV token; git-ignored; absent = unlinked, still boots
    depends_on: [redis]

  compare-2023:                # COMPARE left  → session "compare-monza-2023"
    build: .
    environment:
      ROLE: replay
      REDIS_URL: redis://redis:6379
      SESSION_KEY: compare-monza-2023
      CLIP_FILE: /data/replays/monza-2023-race.jsonl
      PHASE_WALLCLOCK: "1"
    depends_on: [redis]

  compare-2024:                # COMPARE right → session "compare-monza-2024"
    build: .
    environment:
      ROLE: replay
      REDIS_URL: redis://redis:6379
      SESSION_KEY: compare-monza-2024
      CLIP_FILE: /data/replays/monza-2024-race.jsonl
      PHASE_WALLCLOCK: "1"
    depends_on: [redis]

  gateway:
    build: .
    environment:
      ROLE: gateway
      REDIS_URL: redis://redis:6379
      SESSION_KEY: replay       # initial source the gateway fans out
    # Loopback only: every auth control (origin allowlist, Sec-Fetch-Site guard)
    # assumes a single local operator, so don't publish LAN-wide.
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [redis, replay, live]
