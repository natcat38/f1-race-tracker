# The PR gate: Go vet/test/race, Python ingest and bench suites, frontend lint/test/build, and the generated-file checks.

name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt + vet + staticcheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  web:
    name: Web (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - run: npm test -- --coverage

  contract:
    name: Python (contract self-checks + bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r ingest/requirements-dev.txt
      - name: ruff (ingest + bench)
        run: pip install ruff==0.14.5 && ruff check ingest bench
      - name: FILE-MAP is current
        run: python scripts/gen_file_map.py --check
      - name: scripts self-checks (pytest)
        run: python -m pytest . --cov=. --cov-report=term-missing
        working-directory: scripts

      - name: ingest self-checks (pytest)
        run: python -m pytest . --cov=. --cov-report=term-missing
        working-directory: ingest
      - name: bench self-checks (pytest)
        run: python -m pytest . --cov=. --cov-report=term-missing
        working-directory: bench

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck (Go)
        # Intentionally @latest, not pinned: `go run` compiles govulncheck with the repo's Go
        # toolchain (go.mod = 1.26), and older pinned releases fail to build under it
        # ("invalid array length ..."). Tracking latest keeps it toolchain-compatible.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: npm audit (web)
        run: npm audit --audit-level=high
        working-directory: web
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: pip-audit (Python)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r ingest/requirements.txt -r ingest/requirements-dev.txt -r ingest/requirements-live.txt -r bench/requirements.txt
          # signalrcore is installed --no-deps on purpose: its declared msgpack==1.1.2
          # is vulnerable AND conflicts with the patched msgpack>=1.2.1 that
          # requirements.txt pins and the audit above verifies. --no-deps alone still
          # reports that declared pin, so PYSEC-2026-3625 is ignored HERE ONLY — it
          # describes a version this project never installs. signalrcore itself stays
          # audited, so a future advisory against it still fails the build.
          pip-audit --no-deps --ignore-vuln PYSEC-2026-3625 -r ingest/requirements-live-nodeps.txt

  docs-links:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-loopback README.md CONTEXT.md docs/*.md docs/adr/**/*.md"
          fail: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose build
        run: docker compose build
      # A build only proves the COPY lines succeed, not that the image can run:
      # #72 added an import to live.py that Dockerfile.live did not ship, and the
      # image built green then died at start-up. live.py is main-guarded, so an
      # import is a safe smoke test.
      - name: live image imports its modules
        run: docker compose run --rm --no-deps --entrypoint python live -c "import live"
