# Supply-chain and dependency-hygiene checks run alongside CI.

name: OKF
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate knowledge/ bundle against the house standard
        uses: natcat38/okf-portfolio-standard@e136499a538b4184fadb2e235962c62cb61b132c # v1
        with:
          path: .
