# Supply-chain and dependency-hygiene checks run alongside CI.

name: OKF
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate knowledge/ bundle against the house standard
        uses: natcat38/okf-portfolio-standard@ac51539e19f1c0741b0ff1f6e4c35df32c10cb28 # v1
        with:
          path: .
