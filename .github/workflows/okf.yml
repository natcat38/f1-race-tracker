# Supply-chain and dependency-hygiene checks run alongside CI.

name: OKF
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate knowledge/ bundle against the house standard
        uses: natcat38/okf-portfolio-standard@a9d01a2b63545a4db537a1aaef0d05de1a0ea69a # v1.4.0
        with:
          path: .
